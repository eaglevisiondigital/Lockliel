[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22.13.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."faith-boost-reader"]
  included_files = ["resources/faith-boost-reader/**"]

[[headers]]
  for = "/who-god-says-you-are/read*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"


[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/lockliel-referral-redirect?code=:splat"
  status = 200
  force = true


[[headers]]
  for = "/my-lockliel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

name: One-Time Dependency Audit Fix
on:
  push:
    branches: [lockliel-backend-v1]

permissions:
  contents: write

jobs:
  audit-fix:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-audit-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lockliel-backend-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking production dependency fixes
        run: npm audit fix --omit=dev
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit safe dependency fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply production dependency audit fixes [dependency-audit-fix]"
          git push origin HEAD:lockliel-backend-v1

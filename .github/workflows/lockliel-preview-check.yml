name: Lockliel Preview Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply required Next.js security patch
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').dependencies.next === '16.2.6' ? 0 : 1)"; then
            npm install next@16.3.6 --save-exact --package-lock-only
            git config user.name "Lockliel Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Patch Next.js security vulnerabilities"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - run: npm ci
      - name: Check Netlify function syntax
        run: find netlify -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Import Netlify function modules
        run: node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]); for(const f of walk('netlify/functions').filter(f=>f.endsWith('.mjs'))) await import('./'+f);"
      - name: Production dependency audit snapshot
        run: npm audit --omit=dev --audit-level=high || true
      - name: Build
        run: npm run build
      - name: Current Lockliel automated tests
        run: >
          node --test
          tests/book-release.test.mjs
          tests/faith-boost-resource.test.mjs
          tests/founders50.test.mjs
          tests/my-lockliel-platform.test.mjs

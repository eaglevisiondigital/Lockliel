name: One-Time Grip PDF Import
on:
  push:
    branches: [lockliel-backend-v1]

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[grip-pdf-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one-time private workbook import
        run: |
          curl --fail --show-error --silent             "https://bsndfhbemstyrrglajat.supabase.co/functions/v1/import-grip-pdfs"
